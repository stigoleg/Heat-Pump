name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Xcode 27 lives on its own runner image (actions/runner-images: xcode-27).
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          xcode=$(ls -d /Applications/Xcode_27.2.app /Applications/Xcode.app 2>/dev/null | head -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Unit tests
        run: make test

      - name: Build app (unsigned)
        run: |
          xcodegen generate
          xcodebuild -scheme Varmepumpe -configuration Debug -derivedDataPath build/DerivedData \
            -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build -quiet
