name: Varmepumpe
options:
  bundleIdPrefix: com.stigole
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: nb

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Team from the certificate OU; 7QJN5599B2 in the certificate name is the personal ID.
    DEVELOPMENT_TEAM: 49P95434EE
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  HeatPumpKit:
    path: Packages/HeatPumpKit
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    exactVersion: 0.12.1

targets:
  Varmepumpe:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      # Rendered from App/Icon/AppIcon.svg by App/Icon/render.sh.
      - path: App/Assets.xcassets
    # Merged with the generated Info.plist: plain HTTP to the Wi-Fi adapter on the home network.
    info:
      path: App/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_NAME: Varmepumpe
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.stigole.varmepumpe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Varmepumpe
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # Read-only status requests to the heat pump's Wi-Fi adapter on the home network.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Varmepumpe leser status (effekt og temperaturer) direkte fra varmepumpens Wi-Fi-modul på hjemmenettet. Appen endrer ingenting via hjemmenettet."
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: HeatPumpKit
        product: HeatPumpKit
      - target: varmepumpe-mcp
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers

  varmepumpe-mcp:
    type: tool
    platform: macOS
    sources:
      - path: Packages/HeatPumpKit/Sources/varmepumpe-mcp
    settings:
      base:
        PRODUCT_NAME: varmepumpe-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.stigole.varmepumpe.mcp
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
    dependencies:
      - package: HeatPumpKit
        product: HeatPumpKit
      - package: MCP
        product: MCP

schemes:
  Varmepumpe:
    build:
      targets:
        Varmepumpe: all
        varmepumpe-mcp: all
    run:
      config: Debug
      environmentVariables:
        VARMEPUMPE_BACKEND: mock
      isEnabled: false
